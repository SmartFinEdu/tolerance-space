                        ${generateQuiz(3, "Питання 3", 
                            "Які дві події вшановують у День Гідності та Свободи?",
                            [
                                { text: "Помаранчеву революцію та Революцію Гідності", correct: true, reason: "Саме так! Події 2004 та 2013-2014 років." },
                                { text: "Проголошення Незалежності та День Конституції", correct: false, reason: "Ці свята відзначають влітку." },
                                { text: "Студентську революцію на граніті та Майдан", correct: false, reason: "Революція на граніті була раніше, у 1990 році." }
                            ]
                        )}

                        ${generateQuiz(4, "Питання 4", 
                            "Коли відзначають Міжнародний день толерантності?",
                            [
                                { text: "1 вересня", correct: false, reason: "Це День знань." },
                                { text: "16 листопада", correct: true, reason: "Правильно! Це свято було запроваджено ЮНЕСКО." },
                                { text: "1 червня", correct: false, reason: "Це День захисту дітей." }
                            ]
                        )}

                        ${generateQuiz(5, "Питання 5", 
                            "Що таке кібербулінг?",
                            [
                                { text: "Захист комп'ютера від вірусів", correct: false, reason: "Це кібербезпека." },
                                { text: "Цькування, образи або погрози в інтернеті", correct: true, reason: "Так! Це дуже небезпечне явище, з яким треба боротися." },
                                { text: "Реклама у соціальних мережах", correct: false, reason: "Це називається таргетинг або просто спам." }
                            ]
                        )}

                        ${generateQuiz(6, "Питання 6", 
                            "Що слід зробити, якщо ти бачиш дуже емоційний і скандальний заголовок новини?",
                            [
                                { text: "Одразу репостнути всім друзям", correct: false, reason: "Так поширюються фейки!" },
                                { text: "Перевірити джерело та пошукати інші підтвердження", correct: true, reason: "Правильно! Емоції часто використовують для маніпуляцій." },
                                { text: "Написати гнівний коментар", correct: false, reason: "Це лише підніме популярність фейку." }
                            ]
                        )}

                        ${generateQuiz(7, "Питання 7", 
                            "Чи правда, що бути толерантним означає погоджуватися з будь-якою думкою?",
                            [
                                { text: "Так, треба завжди погоджуватися", correct: false, reason: "Ні, ти маєш право на власну думку." },
                                { text: "Ні, це означає поважати право людини на іншу думку, навіть якщо ти з нею не згоден", correct: true, reason: "Абсолютно правильно!" }
                            ]
                        )}

                        ${generateQuiz(8, "Питання 8", 
                            "Що таке «фейк» в інтернеті?",
                            [
                                { text: "Правдива, але нецікава новина", correct: false, reason: "Це просто нудна новина." },
                                { text: "Спеціально вигадана або перекручена інформація для обману", correct: true, reason: "Так, фейки створюють для маніпуляції суспільством." },
                                { text: "Новий молодіжний тренд у TikTok", correct: false, reason: "Фейки існують скрізь, це не розвага." }
                            ]
                        )}

                        ${generateQuiz(9, "Питання 9", 
                            "Як правильно захищати свої особисті кордони в соцмережах?",
                            [
                                { text: "Додавати всіх підряд у друзі", correct: false, reason: "Це небезпечно для приватності." },
                                { text: "Не ділитися особистими даними та блокувати тих, хто тебе ображає", correct: true, reason: "Правильно! Ти маєш право на безпечний цифровий простір." },
                                { text: "Видалити всі свої акаунти назавжди", correct: false, reason: "Це занадто радикально, достатньо дотримуватись правил безпеки." }
                            ]
                        )}

                        ${generateQuiz(10, "Питання 10", 
                            "Яке місце в Києві стало головним символом Революції Гідності?",
                            [
                                { text: "Майдан Незалежності", correct: true, reason: "Так, саме там відбувалися найважливіші та найтрагічніші події." },
                                { text: "Софійська площа", correct: false, reason: "Там також збиралися люди, але серцем був Майдан." },
                                { text: "Контрактова площа", correct: false, reason: "Це історичне місце, але не епіцентр революції." }
                            ]
                        )}

                        ${generateQuiz(11, "Питання 11", 
                            "Чому двофакторна автентифікація (2FA) є важливою?",
                            [
                                { text: "Вона робить інтернет швидшим", correct: false, reason: "Це не впливає на швидкість інтернету." },
                                { text: "Це додатковий рівень захисту твого акаунта від зламу", correct: true, reason: "Правильно! Навіть якщо хтось дізнається пароль, він не зайде без коду." },
                                { text: "Це просто нав'язлива реклама від розробників", correct: false, reason: "Це базовий стандарт безпеки." }
                            ]
                        )}

                        ${generateQuiz(12, "Питання 12", 
                            "Де, згідно з правилами толерантності, закінчується свобода однієї людини?",
                            [
                                { text: "Там, де починається свобода іншої", correct: true, reason: "Це золоте правило толерантності та демократії!" },
                                { text: "Вона ніколи не закінчується", correct: false, reason: "Абсолютна свобода без меж призводить до хаосу." },
                                { text: "Коли закінчуються гроші на інтернеті", correct: false, reason: "Це смішно, але неправильно :)" }
                            ]
                        )}
                    </div>
                `
            },
            {
                id: 5,
                title: "5. Підсумок",
                icon: "🏅",
                render: () => {
                    let message = "";
                    let bgColor = "";
                    let emoji = "";
                    
                    if (score <= 5) {
                        message = "Гарна спроба! Тобі ще є чому повчитися у сфері медіаграмотності та історії. Пам'ятай: твоя гідність і свобода — це найцінніше. Будь уважним у мережі та поважай інших!";
                        bgColor = "bg-blue-50 border-blue-200 text-blue-900";
                        emoji = "🌱";
                    } else if (score <= 9) {
                        message = "Чудовий результат! Ти добре знаєш історію своєї країни та розумієш, як поводитися в інтернеті. Продовжуй розвивати критичне мислення і завжди захищай свої кордони!";
                        bgColor = "bg-primary-50 border-primary-300 text-primary-900";
                        emoji = "🚀";
                    } else {
                        message = "Блискуче! Ти справжній свідомий громадянин і крутий знавець цифрової гігієни! Ти поважаєш себе та інших, відрізняєш правду від фейків і знаєш ціну свободи. Так тримати!";
                        bgColor = "bg-accent-50 border-accent-400 text-accent-900";
                        emoji = "👑";
                    }

                    return `
                    <div class="fade-in max-w-4xl mx-auto text-center py-10">
                        <h2 class="text-4xl md:text-6xl font-black text-slate-800 mb-10">
                            🎉 Фінальний результат
                        </h2>
                        
                        <div class="inline-block relative mb-12">
                            <div class="w-56 h-56 rounded-full bg-white flex items-center justify-center border-[12px] border-primary-500 shadow-2xl mx-auto relative z-10">
                                <span class="text-8xl font-black text-primary-600">${score}<span class="text-5xl text-primary-300">/12</span></span>
                            </div>
                            <div class="absolute -top-6 -right-6 text-7xl animate-bounce z-20 drop-shadow-lg">${emoji}</div>
                            <div class="absolute inset-0 bg-primary-200 rounded-full blur-3xl opacity-50 z-0"></div>
                        </div>

                        <div class="p-10 rounded-[2rem] border-4 ${bgColor} shadow-xl mb-10">
                            <p class="text-3xl font-bold leading-relaxed">${message}</p>
                        </div>

                        <button onclick="navigate(1); resetGame();" class="mt-8 px-10 py-5 bg-slate-800 text-white font-black text-2xl rounded-3xl hover:bg-slate-700 transition shadow-2xl hover:-translate-y-1">
                            🔄 Почати спочатку
                        </button>
                    </div>
                `
                }
            }
        ];

        // --- Helpers ---
        function generateEmojiCard(id, question, answer) {
            return `
                <div class="emoji-card bg-primary-50 border-2 border-primary-100 p-6 rounded-3xl text-center flex flex-col justify-center min-h-[150px]" onclick="document.getElementById('ans-${id}').classList.remove('hidden')">
                    <div class="text-xl font-bold text-slate-800 mb-2">${question}</div>
                    <div class="text-sm font-bold text-primary-500 uppercase mb-2">Натисни, щоб відкрити правду</div>
                    <div id="ans-${id}" class="hidden text-xl font-black text-primary-800 bg-white p-4 rounded-xl shadow-inner mt-4 border-2 border-primary-200 fade-in">
                        ✨ ${answer}
                    </div>
                </div>
            `;
        }

        function generateQuiz(id, title, desc, answers) {
            let btns = answers.map((ans) => `
                <button onclick="answerQuiz(${id}, ${ans.correct}, this, '${ans.reason.replace(/'/g, "\\'")}')" 
                        class="text-left p-6 text-xl md:text-2xl font-bold border-4 border-slate-100 rounded-3xl hover:bg-primary-50 hover:border-primary-200 transition w-full shadow-sm mb-4">
                    ${ans.text}
                </button>
            `).join('');

            return `
                <div class="mb-12 border-4 border-slate-100 rounded-[2rem] overflow-hidden shadow-lg bg-white">
                    <div class="bg-primary-50 p-6 md:p-8 border-b-4 border-slate-100">
                        <h3 class="font-black text-2xl md:text-3xl flex items-center gap-3 mb-4 text-primary-800">${title}</h3>
                        <p class="text-xl md:text-2xl text-slate-700 leading-relaxed font-semibold">${desc}</p>
                    </div>
                    <div class="p-6 md:p-8" id="quiz-${id}-container">
                        <div class="flex flex-col">
                            ${btns}
                        </div>
                        <div id="quiz-${id}-feedback" class="mt-6 text-xl md:text-2xl font-bold hidden p-6 rounded-2xl border-4"></div>
                    </div>
                </div>
            `;
        }

        // --- Core Navigation ---
        function initApp() {
            renderNav();
            renderContent();
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = blocks.map(block => `
                <button onclick="navigate(${block.id})" 
                    class="flex items-center gap-4 text-left w-full px-4 py-4 rounded-2xl transition-all duration-200 border-4 ${
                        activeBlockId === block.id 
                        ? 'bg-primary-600 border-primary-600 text-white shadow-xl scale-[1.02]' 
                        : 'bg-white border-transparent text-slate-600 hover:bg-primary-50 hover:border-primary-100'
                    }">
                    <span class="text-3xl drop-shadow-md">${block.icon}</span>
                    <span class="text-lg md:text-xl font-black leading-tight">${block.title.split('. ')[1] || block.title}</span>
                </button>
            `).join('');
        }

        function renderContent() {
            const contentArea = document.getElementById('content-area');
            const block = blocks.find(b => b.id === activeBlockId);
            contentArea.innerHTML = block.render();
            contentArea.scrollTop = 0;
            resetSimulators();
        }

        function navigate(id) {
            activeBlockId = id;
            renderNav();
            renderContent();
        }

        function resetGame() {
            score = 0;
            answeredQuizzes.clear();
            document.getElementById('score-display').innerText = score;
        }

        function resetSimulators() {
            // Block 1
            currentBalance = 0;
            balanceScoreVal = 0;
            lightsCount = 0;

            // Block 2
            currentScramble = "";
            clickedLetters = [];

            // Block 3
            currentFake = 0;
            fakeScore = 0;
            toxicLeft = 2;
        }

        // --- Simulators Logic ---
        
        // 1. Balance Logic
        function checkBalance(isRightSelection) {
            if(currentBalance >= balanceQuestions.length) return;
            
            let q = balanceQuestions[currentBalance];
            if (q.isRight === isRightSelection) {
                balanceScoreVal++;
            }
            currentBalance++;
            
            if (currentBalance < balanceQuestions.length) {
                document.getElementById('balance-text').innerText = balanceQuestions[currentBalance].text;
            } else {
                document.getElementById('balance-btns').classList.add('hidden');
                let res = document.getElementById('balance-result');
                res.classList.remove('hidden');
                res.innerHTML = `Аналіз завершено! Твій результат: <b>${balanceScoreVal}/${balanceQuestions.length}</b> правильних.`;
            }
        }

        // 2. Lights Logic
        function turnOnLight(el) {
            if(!el.dataset.on) {
                el.dataset.on = "1";
                el.classList.remove('grayscale', 'opacity-50');
                el.classList.add('drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]', 'scale-110');
                lightsCount++;
                if(lightsCount === 5) {
                    let res = document.getElementById('lights-result');
                    res.classList.remove('hidden');
                    res.classList.add('fade-in');
                    res.innerHTML = "Світло перемагає темряву, коли ми об'єднуємо зусилля! 🌟";
                }
            }
        }

        // 3. Scramble Word Logic
        function clickLetter(btn, letter) {
            currentScramble += letter;
            clickedLetters.push(btn);
            btn.classList.add('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
            btn.classList.remove('active:translate-y-1', 'active:shadow-none');
            
            let disp = document.getElementById('scramble-disp');
            let padded = currentScramble.padEnd(6, '_');
            disp.innerText = padded.split('').join(' ');
            
            if (currentScramble.length === 6) {
                let res = document.getElementById('scramble-result');
                res.classList.remove('hidden');
                if (currentScramble === scrambleWord) {
                    res.innerHTML = "Правильно! Основа толерантності — це ПОВАГА. 🤝";
                    res.classList.add('text-accent-400');
                    res.classList.remove('text-red-400');
                } else {
                    res.innerHTML = "Слово зібрано неправильно. Спробуй ще!";
                    res.classList.add('text-red-400');
                    res.classList.remove('text-accent-400');
                }
            }
        }

        function resetScramble() {
            currentScramble = "";
            clickedLetters.forEach(btn => {
                btn.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                btn.classList.add('active:translate-y-1', 'active:shadow-none');
            });
            clickedLetters = [];
            document.getElementById('scramble-disp').innerText = "_ _ _ _ _ _";
            document.getElementById('scramble-result').classList.add('hidden');
        }

        // 4. Fake Detector Logic
        function checkFake(isFakeSelection) {
            if (currentFake >= fakeNews.length) return;
            
            let q = fakeNews[currentFake];
            if (q.isFake === isFakeSelection) {
                fakeScore++;
            }
            currentFake++;
            
            if (currentFake < fakeNews.length) {
                document.getElementById('fake-text').innerText = fakeNews[currentFake].title;
            } else {
                document.getElementById('fake-btns').classList.add('hidden');
                let res = document.getElementById('fake-result');
                res.classList.remove('hidden');
                res.innerHTML = `Перевірку завершено! Ти розпізнав: <b>${fakeScore}/${fakeNews.length}</b>. Довіряй, але перевіряй! 🕵️‍♂️`;
            }
        }
        
        // 5. Password Logic
        function checkPass() {
            const val = document.getElementById('pass-input').value;
            const reqLen = val.length >= 8;
            const reqUp = /[A-ZА-ЯІЇЄ]/i.test(val) && val.toLowerCase() !== val; // check for true uppercase
            const reqNum = /[0-9]/.test(val);
            const reqSym = /[^A-ZА-ЯІЇЄa-zа-яіїє0-9\s]/i.test(val);

            const elLen = document.getElementById('req-len');
            const elUp = document.getElementById('req-up');
            const elNum = document.getElementById('req-num');
            const elSym = document.getElementById('req-sym');

            elLen.innerHTML = reqLen ? "✅ Мінімум 8 символів" : "❌ Мінімум 8 символів";
            elLen.className = reqLen ? "text-green-400 font-bold transition-colors" : "text-fuchsia-300 transition-colors";

            elUp.innerHTML = reqUp ? "✅ Велика літера" : "❌ Велика літера";
            elUp.className = reqUp ? "text-green-400 font-bold transition-colors" : "text-fuchsia-300 transition-colors";

            elNum.innerHTML = reqNum ? "✅ Цифра" : "❌ Цифра";
            elNum.className = reqNum ? "text-green-400 font-bold transition-colors" : "text-fuchsia-300 transition-colors";

            elSym.innerHTML = reqSym ? "✅ Спеціальний символ (@, #, тощо)" : "❌ Спеціальний символ (@, #, тощо)";
            elSym.className = reqSym ? "text-green-400 font-bold transition-colors" : "text-fuchsia-300 transition-colors";
            
            let res = document.getElementById('pass-result');
            if (reqLen && reqUp && reqNum && reqSym) {
               res.classList.remove('hidden');
               res.innerHTML = "Супер! Твій акаунт тепер надійно захищено. 🛡️";
            } else {
               res.classList.add('hidden');
            }
        }
        
        // 6. Toxic Filter Logic
        function removeToxic(id, isToxic) {
            let el = document.getElementById('comm-' + id);
            let res = document.getElementById('toxic-result');
            
            if (isToxic) {
                el.style.opacity = '0';
                el.style.transform = 'scale(0.9)';
                setTimeout(() => el.style.display = 'none', 300);
                
                toxicLeft--;
                if (toxicLeft === 0) {
                    res.classList.remove('hidden');
                    res.classList.add('fade-in');
                    res.innerHTML = "Молодець! Токсичні коментарі видалено. У мережі стало чистіше! ✨";
                    res.classList.add('text-accent-400');
                    res.classList.remove('text-red-400');
                }
            } else {
                res.classList.remove('hidden');
                res.innerHTML = "Обережно! Ти намагаєшся видалити позитивний коментар! 🚫";
                res.classList.remove('text-accent-400');
                res.classList.add('text-red-400');
                setTimeout(() => res.classList.add('hidden'), 2500);
            }
        }

        // --- Quiz Logic ---
        function answerQuiz(quizId, isCorrect, btnElement, reason) {
            const container = document.getElementById(`quiz-${quizId}-container`);
            const feedback = document.getElementById(`quiz-${quizId}-feedback`);
            
            if (!answeredQuizzes.has(quizId)) {
                if (isCorrect) {
                    score++;
                    document.getElementById('score-display').innerText = score;
                    const globalScore = document.querySelector('header #score-display');
                    if(globalScore) globalScore.innerText = score;
                }
                answeredQuizzes.add(quizId);
            }

            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
                b.classList.remove('hover:bg-primary-50', 'hover:border-primary-200');
            });
            
            btnElement.classList.remove('opacity-50');
            feedback.style.display = 'block';
            feedback.classList.remove('hidden', 'fade-in');
            void feedback.offsetWidth;
            feedback.classList.add('fade-in');
            
            if(isCorrect) {
                btnElement.classList.add('bg-green-100', 'border-green-500', 'text-green-900');
                feedback.className = "mt-6 text-xl md:text-2xl p-6 rounded-3xl bg-green-50 border-4 border-green-300 text-green-900 fade-in";
                feedback.innerHTML = `<b>✅ Правильно!</b><br><span class="text-lg md:text-xl font-medium mt-3 inline-block">${reason}</span>`;
            } else {
                btnElement.classList.add('bg-red-100', 'border-red-500', 'text-red-900');
                
                buttons.forEach(b => {
                    if(b.getAttribute('onclick').includes('true')) {
                        b.classList.remove('opacity-50');
                        b.classList.add('border-green-400', 'bg-green-50');
                    }
                });

                feedback.className = "mt-6 text-xl md:text-2xl p-6 rounded-3xl bg-red-50 border-4 border-red-300 text-red-900 fade-in";
                feedback.innerHTML = `<b>❌ Помилка!</b><br><span class="text-lg md:text-xl font-medium mt-3 inline-block">${reason}</span>`;
            }
        }

        // Init App on Load
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
